[package]
name          = "esp-net-easy"
version       = "1.0.0"
edition       = "2024"
authors       = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
description   = "No_std asynchronous ESP32 WiFi and network stack abstraction powered by Hazard3."
readme        = "README.md"
license       = "GPL-2.0-or-later"
repository    = "https://github.com/jorgeandrecastro/esp-net-easy"
documentation = "https://docs.rs/esp-net-easy"
keywords      = ["esp32", "wifi", "hazard3", "network", "no-std"]
categories    = ["embedded", "no-std", "hardware-support"]

[lib]
name = "esp_net_easy"
path = "src/lib.rs"

[dependencies]
# Hazard3 packages with source-compatible Rust library names.
embassy-executor = { package = "hazard3-executor", version = "0.1.2" }
embassy-net      = { package = "hazard3-net-async", version = "0.3.1", features = ["ipv4", "medium-ethernet", "tcp", "dns"] }
embassy-time     = { package = "hazard3-time", version = "0.1.3" }

# ESP32 ecosystem
esp-hal      = { version = "1.1", features = ["unstable"] }
esp-radio    = { version = "0.18", features = ["wifi"] }
esp-rtos     = { version = "0.3", features = ["embassy"] }
esp-println  = { version = "0.17", features = ["log-04"] }
static_cell  = { version = "2.1" }
heapless     = { version = "0.9" }

[features]
esp32c3 = ["esp-hal/esp32c3", "esp-radio/esp32c3", "esp-rtos/esp32c3", "esp-println/esp32c3"]
esp32c6 = ["esp-hal/esp32c6", "esp-radio/esp32c6", "esp-rtos/esp32c6", "esp-println/esp32c6"]
esp32s3 = ["esp-hal/esp32s3", "esp-radio/esp32s3", "esp-rtos/esp32s3", "esp-println/esp32s3"]
esp32   = ["esp-hal/esp32", "esp-radio/esp32", "esp-rtos/esp32", "esp-println/esp32"]

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
